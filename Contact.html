<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
    <title>Contact With us</title>
</head>
<style>


body {
  background-color: #f4f4f4;
  padding: 20px;
}

.contact-container {
  display: flex;
  flex-wrap: wrap;
  background: white;
  border-radius: 8px;
  overflow: hidden;
  max-width: 900px;
  margin: auto;
  box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

.contact-image {
  flex: 1 1 50%;
}

.contact-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.contact-form {
  flex: 1 1 50%;
  padding: 40px;
}

.contact-form h2 {
  margin-bottom: 20px;
  color: #333;
}

.contact-form label {
  display: block;
  margin: 15px 0 5px;
  color: #555;
}
.heros{
    padding: 15px;
}
.contact-form input,
.contact-form textarea {
  width: 100%;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 4px;
  resize: none;
}

.contact-form button {
  margin-top: 20px;
  padding: 12px 25px;
  background-color: #007bff;
  color: white;
  border: none;
  border-radius: 25px;
  cursor: pointer;
  font-size: 16px;
}

.contact-form button:hover {
  background-color: #0056b3;
}

/* Responsive */
@media (max-width: 768px) {
  .contact-container {
    flex-direction: column;
  }

  .contact-image,
  .contact-form {
    flex: 1 1 100%;
  }

  .contact-form {
    padding: 20px;
  }
}

</style>
<body>
     <div class="heros">
        <nav>
            <div class="logo">Car collection</div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="Features.html">Features</a></li>
                <li><a href="Contact.html">Contact</a></li>
            </ul>
        </nav>

       
    </div>
    <section>

<div class="contact-container">
    <div class="contact-image">
      <img src="IMG_8215.JPG" alt="Contact Us Image">
    </div>

    <div class="contact-form">
      <h2>Contact Us</h2>
      <form>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Your email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Write your message..." rows="5" required></textarea>

        <button type="submit">Send Message</button>
      </form>
    </div>
  </div>
        
    </section>
</body>
</html>
